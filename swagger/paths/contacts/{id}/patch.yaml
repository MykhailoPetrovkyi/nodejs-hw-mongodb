tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: Patch contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: Contact's name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact's phone number
            type: string
            example: 0505050505
          email:
            description: Contact's email
            type: string
            example: john.doe@mail.com
          isFavourite:
            description: Whether the contact is favourite
            type: boolean
            example: true
            default: false
          contactType:
            description: Contact type
            type: string
            enum: ['work', 'home', 'personal']
            example: home
            default: personal
          photo:
            description: Contact's photo
            type: string
            format: binary
responses:
  '200':
    description: Patch contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: ../../../components/responses/401.yaml
  '403':
    description: Access denied
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 403
            message:
              type: string
              example: Access denied
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
